<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İhbar Formu - Taşköprü Gazetesi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: #f4f6f9; padding: 15px; }
.container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
.header { background: #e31e24; color: white; padding: 20px; text-align: center; }
.header h2 { font-size: 1.3rem; margin-bottom: 5px; }
.header p { font-size: 0.85rem; opacity: 0.9; }
.form-body { padding: 20px; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 0.9rem; }
input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: #e31e24; }
.radio-group { display: flex; gap: 15px; margin-top: 5px; }
.radio-group label { display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer; }
.radio-group input[type="radio"] { width: auto; }
.btn-location { background: #4CAF50; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-location:disabled { background: #ccc; cursor: not-allowed; }
.btn-location.success { background: #28a745; }
.status { font-size: 13px; margin-top: 5px; color: #666; }
.status.success { color: #28a745; }
.status.error { color: #dc3545; }
.btn-submit { background: #e31e24; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }
.file-input { border: 2px dashed #ddd; padding: 15px; text-align: center; border-radius: 6px; cursor: pointer; }
.file-input:hover { border-color: #e31e24; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>📢 Vatandaş İhbar Formu</h2>
    <p>Taşköprü Gazetesi - Adana</p>
  </div>
  
  <div class="form-body">
    <form id="ihbarForm">
      
      <div class="form-group">
        <label>Ad Soyad (İsteğe Bağlı)</label>
        <input type="text" name="adSoyad" placeholder="Adınız Soyadınız">
      </div>

      <div class="form-group">
        <label>Telefon (İsteğe Bağlı)</label>
        <input type="tel" name="telefon" placeholder="05XX XXX XX XX">
      </div>

      <div class="form-group">
        <label>İhbar Türü *</label>
        <select name="ihbarTuru" required>
          <option value="">Seçiniz...</option>
          <option value="Çöp-Moloz-Temizlik">Çöp / Moloz / Temizlik</option>
          <option value="Yol ve Kaldırım">Yol ve Kaldırım Sorunu</option>
          <option value="Yeşil Alan-Park-Bahçe Problemleri">Yeşil Alan / Park / Bahçe</option>
          <option value="Su ve Kanalizasyon">Su ve Kanalizasyon</option>
          <option value="Toplu Taşıma">Toplu Taşıma</option>
          <option value="Trafik ve Otopark">Trafik ve Otopark</option>
          <option value="Yaya Güvenliği">Yaya Güvenliği</option>
          <option value="Gürültü ve Görüntü Kirliliği">Gürültü ve Görüntü Kirliliği</option>
          <option value="Diğer">Diğer</option>
        </select>
      </div>

      <div class="form-group">
        <label>📍 Konum / Adres *</label>
        <button type="button" class="btn-location" id="getLocationBtn" onclick="getLocation()">
          📡 Konumumu Otomatik Bul
        </button>
        <textarea name="adres" id="adresInput" rows="3" placeholder="Konum bulunamadıysa lütfen manuel yazınız..." required></textarea>
        <div class="status" id="locationStatus"></div>
        <input type="hidden" name="latitude" id="latInput">
        <input type="hidden" name="longitude" id="lngInput">
      </div>

      <div class="form-group">
        <label>Google Harita Linki (İsteğe Bağlı)</label>
        <input type="url" name="haritaLink" placeholder="https://maps.app.goo.gl/...">
      </div>

      <div class="form-group">
        <label>Durumu Detaylıca Açıklayınız *</label>
        <textarea name="aciklama" rows="4" placeholder="Sorunu kısaca açıklayınız..." required></textarea>
      </div>

      <div class="form-group">
        <label>Görsel / Video (İsteğe Bağlı)</label>
        <input type="file" name="gorsel" id="gorselInput" accept="image/*,video/*" class="file-input">
        <div class="status" id="fileStatus"></div>
      </div>

      <div class="form-group">
        <label>Kişisel bilgileriniz haberde yer alsın mı?</label>
        <div class="radio-group">
          <label><input type="radio" name="haberdeYeral" value="Evet"> Evet</label>
          <label><input type="radio" name="haberdeYeral" value="Hayır" checked> Hayır</label>
        </div>
      </div>

      <div class="form-group">
        <label>Belediye yetkilileri görsün mü?</label>
        <div class="radio-group">
          <label><input type="radio" name="belediyeGorsun" value="Evet"> Evet</label>
          <label><input type="radio" name="belediyeGorsun" value="Hayır" checked> Hayır</label>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">GÖNDER</button>
    </form>
  </div>
</div>

<script>
// ⚠️ BURAYA APPS SCRIPT WEB APP URL'NİZİ YAZIN
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAhQ5yRel0LcbPIY7d-3JwieeoZBgZ3g6f1MjQXWQ74MQHnyPzqj0tx9woZCUFhwJp/exec";

function getLocation() {
  const status = document.getElementById('locationStatus');
  const btn = document.getElementById('getLocationBtn');
  
  if (!navigator.geolocation) {
    status.textContent = " Tarayıcınız konum özelliğini desteklemiyor.";
    status.className = "status error";
    return;
  }

  status.textContent = "⏳ Konum alınıyor...";
  status.className = "status";
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      document.getElementById('latInput').value = lat;
      document.getElementById('lngInput').value = lng;

      status.textContent = "🔄 Adres bilgisi çözülüyor...";
      
      // Reverse Geocoding (OpenStreetMap - Ücretsiz)
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=tr`)
        .then(response => response.json())
        .then(data => {
          const adres = data.display_name || `${lat}, ${lng}`;
          document.getElementById('adresInput').value = adres;
          status.textContent = "✅ Konum başarıyla eklendi!";
          status.className = "status success";
          btn.textContent = "✅ Konum Alındı";
          btn.className = "btn-location success";
        })
        .catch(() => {
          document.getElementById('adresInput').value = `${lat}, ${lng}`;
          status.textContent = "⚠️ Adres çözülemedi, koordinatlar eklendi.";
          status.className = "status";
          btn.disabled = false;
        });
    },
    (error) => {
      btn.disabled = false;
      switch(error.code) {
        case error.PERMISSION_DENIED:
          status.textContent = "❌ Konum izni reddedildi. Lütfen manuel giriniz.";
          break;
        case error.POSITION_UNAVAILABLE:
          status.textContent = "❌ Konum bilgisi alınamıyor.";
          break;
        case error.TIMEOUT:
          status.textContent = "❌ Konum alma işlemi zaman aşımına uğradı.";
          break;
        default:
          status.textContent = "❌ Bilinmeyen bir hata oluştu.";
      }
      status.className = "status error";
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// Görsel yükleme durumu
document.getElementById('gorselInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const status = document.getElementById('fileStatus');
  if (file) {
    if (file.size > 10 * 1024 * 1024) {
      status.textContent = "❌ Dosya boyutu 10MB'dan küçük olmalıdır.";
      status.className = "status error";
      e.target.value = "";
    } else {
      status.textContent = "✅ " + file.name + " seçildi";
      status.className = "status success";
    }
  }
});

// Form gönderimi
document.getElementById('ihbarForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const btn = document.getElementById('submitBtn');
  btn.textContent = "Gönderiliyor...";
  btn.disabled = true;

  const formData = new FormData(this);
  const data = Object.fromEntries(formData);
  
  // Görsel varsa base64'e çevir
  const fileInput = document.getElementById('gorselInput');
  if (fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      data.gorsel = e.target.result; // Base64
      sendData(data, btn);
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    data.gorsel = "";
    sendData(data, btn);
  }
});

function sendData(data, btn) {
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(data)
  })
  .then(() => {
    alert("✅ İhbarınız başarıyla alındı! Teşekkür ederiz.");
    document.getElementById('ihbarForm').reset();
    document.getElementById('locationStatus').textContent = "";
    document.getElementById('fileStatus').textContent = "";
    btn.textContent = "GÖNDER";
    btn.disabled = false;
  })
  .catch(error => {
    alert("❌ Bir hata oluştu. Lütfen tekrar deneyin.");
    console.error('Hata:', error);
    btn.textContent = "GÖNDER";
    btn.disabled = false;
  });
}
</script>

</body>
</html>
