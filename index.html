<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İhbar Haritası - Taşköprü Gazetesi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet Harita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        .brand-red { color: #e31e24; }
        .bg-brand-red { background-color: #e31e24; }
        .bg-brand-red:hover { background-color: #c4181d; }
        
        /* Harita yüksekliği */
        #map {
            height: 70vh;
            min-height: 500px;
            width: 100%;
            z-index: 1;
        }
        
        /* Yükleniyor animasyonu */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e31e24;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Popup içindeki resim için stil */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
        }
        .leaflet-popup-content {
            margin: 0;
            width: 280px !important;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- ÜST BAŞLIK -->
    <header class="bg-brand-red text-white shadow-md z-10 relative">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://www.taskoprugazetesi.com/images/generals/logo.png?v=2119" alt="Taşköprü Gazetesi" class="h-10 bg-white rounded p-1">
                <div>
                    <h1 class="text-xl font-bold tracking-wide">İHBAR HARİTASI</h1>
                    <p class="text-xs opacity-90">Taşköprü Gazetesi Vatandaş İhbarları</p>
                </div>
            </div>
            <a href="ihbar-listesi.html" class="flex items-center gap-2 bg-white text-red-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                </svg>
                Liste Görünümü
            </a>
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="flex-grow relative">
        
        <!-- Yükleniyor Göstergesi -->
        <div id="loading-overlay" class="absolute inset-0 bg-white bg-opacity-90 z-20 flex flex-col items-center justify-center">
            <div class="loader"></div>
            <p class="text-gray-600 mt-4 font-medium">Harita verileri yükleniyor...</p>
        </div>

        <!-- Hata Mesajı -->
        <div id="error-message" class="hidden absolute inset-0 bg-white bg-opacity-95 z-20 flex flex-col items-center justify-center p-4 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <h3 class="text-lg font-semibold text-gray-800">Veriler Yüklenemedi</h3>
            <p class="text-gray-600 text-sm mt-1 mb-4">Lütfen internet bağlantınızı kontrol edin.</p>
            <button onclick="location.reload()" class="bg-brand-red text-white px-6 py-2 rounded-lg hover:bg-red-700 transition text-sm">Tekrar Dene</button>
        </div>

        <!-- Harita Konteyneri -->
        <div id="map"></div>

    </main>

    <!-- ALT BİLGİ -->
    <footer class="bg-gray-800 text-gray-400 py-4 text-center text-xs">
        <p>© 2026 Taşköprü Gazetesi. Tüm hakları saklıdır.</p>
        <p class="mt-1 text-gray-500">Harita verileri OpenStreetMap tarafından sağlanmaktadır.</p>
    </footer>

    <!-- Leaflet Harita JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- UYGULAMA JAVASCRIPT KODLARI -->
    <script>
        // 🆕 YENİ API URL
        const API_URL = "https://script.google.com/macros/s/AKfycbyZlA_GMA1SeK4tNVUMDU_hxxDOPA6DsfW0iAkKfofxiYBOSWGu8085ntg31qnFY9nt/exec";
        const FALLBACK_IMAGE = "https://via.placeholder.com/400x225/e31e24/ffffff?text=TASKOPRU+GAZETESI";
        
        // Adana Merkez Koordinatları (Yedek)
        const DEFAULT_LAT = 37.0000;
        const DEFAULT_LNG = 35.3213;

        // Haritayı başlat
        const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LNG], 12);

        // OpenStreetMap katmanını ekle
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // Marker ikonu (Kırmızı pin)
        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        async function loadReports() {
            const loadingOverlay = document.getElementById('loading-overlay');
            const errorMsg = document.getElementById('error-message');

            try {
                console.log("🔄 Harita verileri çekiliyor...");
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP Hatası: ${response.status}`);
                }

                const data = await response.json();
                console.log("✅ Başarıyla gelen veri sayısı:", data.length);

                if (!data || data.length === 0) {
                    loadingOverlay.innerHTML = `
                        <div class="text-center p-8">
                            <h3 class="text-xl font-semibold text-gray-700">Henüz Haritada Gösterilecek İhbar Yok</h3>
                            <p class="text-gray-500 mt-2">Yeni ihbarlar onaylandıktan sonra burada görünecektir.</p>
                        </div>
                    `;
                    return;
                }

                let bounds = []; // Haritayı tüm markerlara sığdırmak için

                data.forEach(item => {
                    // Koordinat kontrolü: Yoksa Adana merkezini kullan, ama popup'ta belirt
                    const lat = item.koordinat.lat || DEFAULT_LAT;
                    const lng = item.koordinat.lng || DEFAULT_LNG;
                    const hasValidCoords = item.koordinat.lat && item.koordinat.lng;

                    bounds.push([lat, lng]);

                    // Tarih formatlama
                    const tarihStr = new Date(item.tarih).toLocaleDateString('tr-TR', { 
                        day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });

                    // Popup içeriği (Siyah ekran sorununu çözen onerror eklendi)
                    const popupContent = `
                        <div class="font-sans">
                            <img src="${item.gorsel || FALLBACK_IMAGE}" 
                                 onerror="this.onerror=null; this.src='${FALLBACK_IMAGE}';" 
                                 class="w-full h-32 object-cover" alt="İhbar">
                            <div class="p-3">
                                <span class="inline-block bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded mb-2">
                                    ${item.tur}
                                </span>
                                <h3 class="font-bold text-gray-800 text-sm mb-1">${item.adres}</h3>
                                <p class="text-gray-600 text-xs line-clamp-3 mb-2">${item.aciklama}</p>
                                <div class="flex justify-between items-center text-xs text-gray-500 border-t pt-2">
                                    <span>👤 ${item.adSoyad}</span>
                                    <span>📅 ${tarihStr}</span>
                                </div>
                                ${!hasValidCoords ? '<p class="text-xs text-orange-500 mt-1">⚠️ Koordinat alınamadı, Adana merkezde gösteriliyor.</p>' : ''}
                            </div>
                        </div>
                    `;

                    // Marker ekle
                    L.marker([lat, lng], { icon: redIcon })
                        .addTo(map)
                        .bindPopup(popupContent, { maxWidth: 300 });
                });

                // Haritayı tüm markerları gösterecek şekilde yakınlaştır
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
                }

                // Yükleniyor ekranını kaldır
                loadingOverlay.classList.add('hidden');
                console.log("✅ Harita başarıyla güncellendi.");

            } catch (error) {
                console.error("❌ HARİTA VERİ HATASI:", error);
                loadingOverlay.classList.add('hidden');
                errorMsg.classList.remove('hidden');
            }
        }

        // Sayfa yüklendiğinde çalıştır
        document.addEventListener('DOMContentLoaded', loadReports);
    </script>
</body>
</html>
