<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taşköprü Gazetesi Adana İhbar Haritası</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Marker Cluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; }
        .header { background: #e31e24; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .header p { font-size: 0.9rem; opacity: 0.9; }
        .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 15px; background: white; border-bottom: 1px solid #ddd; }
        .filter-btn { padding: 6px 14px; border: 2px solid #e31e24; background: white; color: #e31e24; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.3s; white-space: nowrap; }
        .filter-btn:hover, .filter-btn.active { background: #e31e24; color: white; }
        #map { height: calc(100vh - 200px); width: 100%; z-index: 1; }
        .loading { text-align: center; padding: 50px; font-size: 1.2rem; color: #666; }
        
        /* Popup Stilleri */
        .ihbar-popup { font-size: 0.9rem; }
        .ihbar-popup h3 { color: #e31e24; margin-bottom: 8px; font-size: 1.1rem; }
        .ihbar-popup p { margin-bottom: 6px; font-size: 0.9rem; color: #333; }
        .ihbar-popup .label { font-weight: bold; color: #555; }
        .ihbar-popup .tarih { font-size: 0.8rem; color: #888; margin-top: 8px; border-top: 1px solid #eee; padding-top: 6px; }
        .popup-img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; border: 1px solid #eee; background: #f0f0f0; }
        
        /* Medya Butonları */
        .media-btn { 
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            margin-top: 4px; padding: 6px 8px; background: #28a745; color: white; 
            text-decoration: none; border-radius: 4px; font-size: 0.75rem; font-weight: 600; 
            text-align: center; flex: 1; min-width: 80px; transition: background 0.2s;
        }
        .media-btn:hover { background: #218838; color: white; }
        .media-btn.video { background: #343a40; }
        .media-btn.video:hover { background: #23272b; }
        .media-btn.map { background: #007bff; }
        .media-btn.map:hover { background: #0056b3; }

        /* Cluster Stilleri */
        .marker-cluster-small { background-color: rgba(227, 30, 36, 0.2); }
        .marker-cluster-small div { background-color: rgba(227, 30, 36, 0.6); }
        .marker-cluster-medium { background-color: rgba(227, 30, 36, 0.2); }
        .marker-cluster-medium div { background-color: rgba(227, 30, 36, 0.6); }
        .marker-cluster-large { background-color: rgba(227, 30, 36, 0.2); }
        .marker-cluster-large div { background-color: rgba(227, 30, 36, 0.6); }

        .stats { display: flex; justify-content: center; gap: 20px; padding: 10px; background: white; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 1.5rem; font-weight: bold; color: #e31e24; }
        .stat-label { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📍 Adana İhbar ve Talep Haritası</h1>
        <p>Vatandaşlarımızdan gelen ihbarların anlık harita görünümü</p>
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Toplam İhbar</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="visibleCount">0</div>
            <div class="stat-label">Görüntülenen</div>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterMap('tumu', this)">📍 Tümü</button>
        <button class="filter-btn" onclick="filterMap('Çöp-Moloz-Temizlik', this)">🗑️ Çöp-Moloz-Temizlik</button>
        <button class="filter-btn" onclick="filterMap('Yol ve Kaldırım', this)">🕳️ Yol ve Kaldırım</button>
        <button class="filter-btn" onclick="filterMap('Yeşil Alan-Park-Bahçe Problemleri', this)">🌳 Yeşil Alan-Park-Bahçe</button>
        <button class="filter-btn" onclick="filterMap('Su ve Kanalizasyon', this)">💧 Su ve Kanalizasyon</button>
        <button class="filter-btn" onclick="filterMap('Toplu Taşıma', this)">🚌 Toplu Taşıma</button>
        <button class="filter-btn" onclick="filterMap('Trafik ve Otopark', this)">🚗 Trafik ve Otopark</button>
        <button class="filter-btn" onclick="filterMap('Yaya Güvenliği', this)">🚸 Yaya Güvenliği</button>
        <button class="filter-btn" onclick="filterMap('Gürültü ve Görüntü Kirliliği', this)">🔊 Gürültü ve Görüntü</button>
        <button class="filter-btn" onclick="filterMap('Diğer', this)">📍 Diğer</button>
    </div>

    <div id="loading" class="loading">⏳ Harita verileri yükleniyor, lütfen bekleyin...</div>
    <div id="map" style="display: none;"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Marker Cluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <script>
        // ⚠️ Buraya en son çalışan ve "Yayınlandı" verisi döndüren API URL'nizi yapıştırın
        const API_URL = "https://script.google.com/macros/s/AKfycbwIp_TfplGwKRwtLwBFABDDgAIlZEpOQil8kcHKcPFA4_yOivFAB_OdoXBO9fk0IRp-/exec
";
        const FALLBACK_IMAGE = "https://via.placeholder.com/400x225/e31e24/ffffff?text=TASKOPRU+GAZETESI";

        let map;
        let markersCluster;
        let allData = [];

        const kategoriEmojileri = {
            'Çöp-Moloz-Temizlik': '🗑️',
            'Yol ve Kaldırım': '🕳️',
            'Yeşil Alan-Park-Bahçe Problemleri': '🌳',
            'Su ve Kanalizasyon': '💧',
            'Toplu Taşıma': '🚌',
            'Trafik ve Otopark': '🚗',
            'Yaya Güvenliği': '🚸',
            'Gürültü ve Görüntü Kirliliği': '🔊',
            'Diğer': '📍'
        };

        function getEmoji(tur) {
            if (!tur) return '📍';
            if (kategoriEmojileri[tur]) return kategoriEmojileri[tur];
            for (const [key, emoji] of Object.entries(kategoriEmojileri)) {
                if (tur.includes(key) || key.includes(tur)) return emoji;
            }
            return '📍';
        }

        // 🆕 Google Drive Thumbnail (Popup için optimize edilmiş)
        function getDriveThumbUrl(url) {
            if (!url) return null;
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match) {
                return `https://lh3.googleusercontent.com/d/${match[1]}=w400`;
            }
            return url;
        }

        // 🆕 Video mu kontrolü
        function isVideo(url) {
            if (!url) return false;
            const lower = url.toLowerCase();
            return lower.includes('video') || lower.includes('/preview') || /\.(mp4|mov|avi|webm|mkv)$/i.test(lower);
        }

        // 🆕 Drive Linkini Önizleme Linkine Çevir (Tıklayınca açılması için)
        function getDrivePreviewUrl(url) {
            if (!url) return url;
            const cleanUrl = url.replace(/#video$/i, '');
            const match = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }
            return cleanUrl;
        }

        function initMap() {
            map = L.map('map').setView([37.0000, 35.3213], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors | Taşköprü Gazetesi',
                maxZoom: 19
            }).addTo(map);
            
            markersCluster = L.markerClusterGroup({
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                zoomToBoundsOnClick: true
            });
            map.addLayer(markersCluster);
            
            fetchData();
        }

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                allData = data;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('map').style.display = 'block';
                document.getElementById('totalCount').textContent = data.length;
                
                setTimeout(() => { map.invalidateSize(); }, 100);
                renderMarkers(allData);
            } catch (error) {
                console.error("Veri çekme hatası:", error);
                document.getElementById('loading').innerHTML = "❌ Veriler yüklenirken bir hata oluştu. Lütfen sayfayı yenileyin.";
            }
        }

        function renderMarkers(data) {
            markersCluster.clearLayers();

            data.forEach(item => {
                const lat = item.koordinat?.lat || 37.0000;
                const lng = item.koordinat?.lng || 35.3213;
                const iconEmoji = getEmoji(item.tur);

                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); background: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">${iconEmoji}</div>`,
                    iconSize: [40, 40],
                    iconAnchor: [20, 40]
                });

                // 🆕 MEDYA İŞLEME (Çoklu Görsel/Video)
                let mediaHtml = '';
                let mediaButtonsHtml = '';

                if (item.gorsel) {
                    const mediaLinks = item.gorsel.split(',').map(u => u.trim()).filter(u => u.length > 10);

                    if (mediaLinks.length > 0) {
                        const firstLink = mediaLinks[0];
                        const isVid = isVideo(firstLink);
                        const thumbUrl = getDriveThumbUrl(firstLink);

                        // İlk medyayı thumbnail olarak göster
                        if (isVid) {
                            mediaHtml += `<div style="text-align:center; background:#000; border-radius:4px; margin-bottom:8px; position:relative;">
                                <div style="font-size:2rem; color:#fff; padding:20px;">🎥 Video</div>
                            </div>`;
                        } else if (thumbUrl) {
                            mediaHtml += `<img src="${thumbUrl}" onerror="this.src='${FALLBACK_IMAGE}'" class="popup-img" alt="İhbar">`;
                        } else {
                            mediaHtml += `<img src="${FALLBACK_IMAGE}" class="popup-img" alt="İhbar">`;
                        }

                        // Tüm medyalar için butonlar oluştur
                        if (mediaLinks.length > 1 || isVid) {
                            mediaButtonsHtml += `<div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;">`;
                            mediaLinks.forEach((link, idx) => {
                                const isThisVid = isVideo(link);
                                const label = isThisVid ? '🎥 Video' : `📷 Görsel ${idx + 1}`;
                                const openLink = getDrivePreviewUrl(link);
                                const btnClass = isThisVid ? 'media-btn video' : 'media-btn';
                                
                                mediaButtonsHtml += `<a href="${openLink}" target="_blank" class="${btnClass}">${label}</a>`;
                            });
                            mediaButtonsHtml += `</div>`;
                        } else {
                            // Sadece 1 görsel varsa, direkt tıklanabilir link yap
                            const openLink = getDrivePreviewUrl(firstLink);
                            mediaButtonsHtml = `<a href="${openLink}" target="_blank" class="media-btn" style="margin-top:8px; width:100%;">📷 Görseli/Videoyu Büyük Gör</a>`;
                        }
                    }
                }
