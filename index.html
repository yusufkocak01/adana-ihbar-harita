 
   


        <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adana İhbar Haritası</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: #f4f6f9; }
.ihbar-header { background: #e31e24; color: #fff; padding: 15px; text-align: center; }
.ihbar-header h3 { margin: 0; font-size: 1.3rem; }
.ihbar-stats { display: flex; justify-content: center; gap: 15px; padding: 8px; background: #fff; border-bottom: 1px solid #ddd; }
.ihbar-stat { text-align: center; }
.ihbar-stat-num { font-size: 1.3rem; font-weight: bold; color: #e31e24; }
.ihbar-filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; padding: 10px; background: #fff; border-bottom: 1px solid #ddd; }
.ihbar-btn { padding: 5px 10px; border: 2px solid #e31e24; background: #fff; color: #e31e24; border-radius: 15px; cursor: pointer; font-weight: 600; font-size: .8rem; }
.ihbar-btn.active { background: #e31e24; color: #fff; }
#map { height: 100vh; width: 100%; }
.ihbar-load { text-align: center; padding: 30px; color: #666; }
</style>
</head>
<body>
<div class="ihbar-header"><h3>📍 Adana İhbar Haritası</h3></div>
<div class="ihbar-stats">
<div class="ihbar-stat"><div class="ihbar-stat-num" id="totalC">0</div><div>Toplam</div></div>
<div class="ihbar-stat"><div class="ihbar-stat-num" id="visC">0</div><div>Gösterilen</div></div>
</div>
<div class="ihbar-filters" id="filterBox"></div>
<div id="ihbar-load" class="ihbar-load">Yükleniyor...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var api="https://script.google.com/macros/s/AKfycbxqgNmsEqgpgFb8vXM_2AjEez90J401544k1uv9rODoWhmO-vIPFQEXkjSz-aAwnB9w/exec";
var map,markers=[],data=[];

// TÜM EMOJİLER KONTROL EDİLDİ VE GARANTİLENDİ
var butonlar=[
  {id:'all', metin:'Tümü', emoji:'📍'},
  {id:'cop', metin:'Çöp-Moloz-Temizlik', emoji:'🗑️'},
  {id:'yol', metin:'Yol ve Kaldırım', emoji:'🕳️'},
  {id:'yesil', metin:'Yeşil Alan-Park-Bahçe', emoji:'🌳'}, 
  {id:'su', metin:'Su ve Kanalizasyon', emoji:'💧'},
  {id:'toplu', metin:'Toplu Taşıma', emoji:'🚌'},
  {id:'trafik', metin:'Trafik ve Otopark', emoji:'🚗'},
  {id:'yaya', metin:'Yaya Güvenliği', emoji:'🚸'},
  {id:'gurultu', metin:'Gürültü ve Görüntü', emoji:'🔊'},
  {id:'diger', metin:'Diğer', emoji:'📍'}
];

var categories={
  'Çöp-Moloz-Temizlik':'cop',
  'Yol ve Kaldırım':'yol',
  'Yeşil Alan-Park-Bahçe Problemleri':'yesil',
  'Su ve Kanalizasyon':'su',
  'Toplu Taşıma':'toplu',
  'Trafik ve Otopark':'trafik',
  'Yaya Güvenliği':'yaya',
  'Gürültü ve Görüntü Kirliliği':'gurultu'
};

function getEmoji(tur){
  if(!tur) return '📍';
  // Yeşil alan için ekstra garanti kontrolü
  if(tur.indexOf('Yeşil')!==-1 || tur.indexOf('Park')!==-1 || tur.indexOf('Bahçe')!==-1) return '🌳';
  
  for(var k in categories){
    if(tur.indexOf(k)!==-1){
      for(var i=0;i<butonlar.length;i++){
        if(butonlar[i].id===categories[k]) return butonlar[i].emoji;
      }
    }
  }
  return '📍';
}

function getKey(tur){
  for(var k in categories){
    if(tur && tur.indexOf(k)!==-1) return categories[k];
  }
  return 'diger';
}

function butonlariOlustur(){
  var box=document.getElementById('filterBox');
  box.innerHTML='';
  for(var i=0;i<butonlar.length;i++){
    var b=butonlar[i];
    var btn=document.createElement('button');
    btn.className='ihbar-btn'+(i===0?' active':'');
    btn.setAttribute('data-id',b.id);
    btn.innerHTML=b.emoji+' '+b.metin;
    btn.onclick=function(){
      document.querySelectorAll('.ihbar-btn').forEach(function(x){x.classList.remove('active');});
      this.classList.add('active');
      filtre(this.getAttribute('data-id'));
    };
    box.appendChild(btn);
  }
}

function initMap(){
  butonlariOlustur();
  map=L.map('map',{center:[37.0000,35.3213],zoom:12});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap | Taşköprü Gazetesi'}).addTo(map);
  
  fetch(api).then(function(r){return r.json();}).then(function(d){
    data=d;
    document.getElementById('totalC').textContent=d.length;
    render(data);
  }).catch(function(e){
    document.getElementById('ihbar-load').innerHTML='Harita verileri yüklenemedi';
  });
}

function render(items){
  markers.forEach(function(m){map.removeLayer(m);});
  markers=[];
  items.forEach(function(item){
    if(item.koordinat && item.koordinat.lat){
      var icon=L.divIcon({
        className:'custom',
        html:'<div style="font-size:22px;background:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.3);">'+getEmoji(item.tur)+'</div>',
        iconSize:[36,36],
        iconAnchor:[18,36]
      });
      var popup='<div style="min-width:200px;"><b>'+getEmoji(item.tur)+' '+item.tur+'</b><br><br>📍 <b>Adres:</b> '+item.adres+'<br><br>📝 <b>Açıklama:</b> '+item.aciklama+'</div>';
      markers.push(L.marker([item.koordinat.lat,item.koordinat.lng],{icon:icon}).bindPopup(popup).addTo(map));
    }
  });
  document.getElementById('visC').textContent=markers.length;
}

function filtre(cat){
  if(cat==='all'){
    render(data);
  } else {
    var filtered=data.filter(function(i){return getKey(i.tur)===cat;});
    render(filtered);
  }
}

window.addEventListener('load',function(){setTimeout(initMap,100);});
window.addEventListener('resize',function(){if(map)map.invalidateSize();});
</script>
</body>
</html>
