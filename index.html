<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taşköprü Gazetesi Adana İhbar Haritası</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; overscroll-behavior: contain; }
        .header { background: #e31e24; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .header p { font-size: 0.9rem; opacity: 0.9; }
        .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 15px; background: white; border-bottom: 1px solid #ddd; }
        .filter-btn { padding: 6px 14px; border: 2px solid #e31e24; background: white; color: #e31e24; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.3s; white-space: nowrap; }
        .filter-btn:hover, .filter-btn.active { background: #e31e24; color: white; }
        .filter-btn.cozuldu-btn { border-color: #06d6a0; color: #06d6a0; }
        .filter-btn.cozuldu-btn:hover, .filter-btn.cozuldu-btn.active { background: #06d6a0; color: white; }
        #map { height: calc(100vh - 200px); width: 100%; z-index: 1; }
        .loading { text-align: center; padding: 50px; font-size: 1.2rem; color: #666; }
        
        .ihbar-popup { font-size: 0.9rem; }
        .ihbar-popup h3 { color: #e31e24; margin-bottom: 8px; font-size: 1.1rem; }
        .ihbar-popup p { margin-bottom: 6px; font-size: 0.9rem; color: #333; }
        .ihbar-popup .label { font-weight: bold; color: #555; }
        .ihbar-popup .tarih { font-size: 0.8rem; color: #888; margin-top: 8px; border-top: 1px solid #eee; padding-top: 6px; }
        .ihbar-popup .kurum-badge { background: #e31e24; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .ihbar-popup .cozum-box { background: #f0fdf4; border-left: 4px solid #06d6a0; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .ihbar-popup .cozum-box .cozum-label { font-weight: bold; color: #06d6a0; font-size: 0.8rem; margin-bottom: 4px; }
        .ihbar-popup .cozum-box .cozum-text { color: #333; font-size: 0.85rem; line-height: 1.4; }
        .popup-img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; border: 1px solid #eee; background: #f0f0f0; }
        
        .media-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; margin-top: 4px; padding: 6px 8px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-align: center; flex: 1; min-width: 80px; transition: background 0.2s; }
        .media-btn:hover { background: #218838; color: white; }
        .media-btn.video { background: #343a40; }
        .media-btn.video:hover { background: #23272b; }
        .media-btn.map { background: #007bff; }
        .media-btn.map:hover { background: #0056b3; }

        .ihbar-no-container { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
        .ihbar-no { background: #f3f4f6; color: #374151; padding: 6px 8px; border-radius: 4px; font-size: 0.82rem; font-family: monospace; font-weight: bold; border: 1px solid #ddd; flex: 1; user-select: none; }
        .copy-btn { background: #06d6a0; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.82rem; font-weight: bold; cursor: pointer; transition: all 0.3s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
        .copy-btn:hover { background: #05b88a; }
        .copy-btn.copied { background: #e31e24 !important; }

        .marker-cluster-small { background-color: rgba(227, 30, 36, 0.2); }
        .marker-cluster-small div { background-color: rgba(227, 30, 36, 0.6); }
        .marker-cluster-medium { background-color: rgba(227, 30, 36, 0.2); }
        .marker-cluster-medium div { background-color: rgba(227, 30, 36, 0.6); }
        .marker-cluster-large { background-color: rgba(227, 30, 36, 0.2); }
        .marker-cluster-large div { background-color: rgba(227, 30, 36, 0.6); }

        .stats { display: flex; justify-content: center; gap: 20px; padding: 10px; background: white; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 1.5rem; font-weight: bold; color: #e31e24; }
        .stat-label { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📍 Adana İhbar ve Talep Haritası</h1>
        <p>Vatandaşlarımızdan gelen ihbarların anlık harita görünümü</p>
    </div>

    <div class="stats">
        <div class="stat-item"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Toplam İhbar</div></div>
        <div class="stat-item"><div class="stat-number" id="visibleCount">0</div><div class="stat-label">Görüntülenen</div></div>
    </div>

    <div class="filters" id="filterBox"></div>
    <div id="loading" class="loading">⏳ Harita verileri yükleniyor, lütfen bekleyin...</div>
    <div id="map" style="display: none;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbymNOBui2YIyaR0Nvt8BNEkvUy6oYqvAOxlDf4ikcdaUYF6TGNW6QmNCYWjEL-FuKAW/exec";
        const FALLBACK_IMAGE = "https://via.placeholder.com/400x225/e31e24/ffffff?text=TASKOPRU+GAZETESI";
        const ADANA_CENTER = [37.0000, 35.3213];
        const ADANA_ZOOM = 12;

        let map, markersCluster, allData = [];
        let activeFilter = 'all';
        let activeStatus = 'yayinlandi';

        const kategoriEmojileri = {
            'Çöp-Moloz-Temizlik': '🗑️', 'Yol ve Kaldırım': '🕳️', 'Yeşil Alan-Park-Bahçe Problemleri': '🌳',
            'Su ve Kanalizasyon': '💧', 'Toplu Taşıma': '🚌', 'Trafik ve Otopark': '🚗',
            'Yaya Güvenliği': '🚸', 'Gürültü ve Görüntü Kirliliği': '🔊', 'Diğer': '📍'
        };

        function getEmoji(tur) {
            if (!tur) return '📍';
            if (kategoriEmojileri[tur]) return kategoriEmojileri[tur];
            for (const [key, emoji] of Object.entries(kategoriEmojileri)) {
                if (tur.includes(key) || key.includes(tur)) return emoji;
            }
            return '📍';
        }

        function extractCoordsFromMapLink(mapLink) {
            if (!mapLink) return null;
            let match = mapLink.match(/[?&]q=(-?\d+\.\d+)[,+](-?\d+\.\d+)/);
            if (match) return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
            match = mapLink.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (match) return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
            match = mapLink.match(/!3d(-?\d+\.\d+).*?!4d(-?\d+\.\d+)/);
            if (match) return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
            return null;
        }

        function getDriveThumbUrl(url) {
            if (!url) return null;
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match) return `https://lh3.googleusercontent.com/d/${match[1]}=w400`;
            return url;
        }

        function isVideo(url) {
            if (!url) return false;
            const lower = url.toLowerCase();
            return lower.includes('video') || lower.includes('/preview') || /\.(mp4|mov|avi|webm|mkv)$/i.test(lower);
        }

        function getDrivePreviewUrl(url) {
            if (!url) return url;
            const cleanUrl = url.replace(/#video$/i, '');
            const match = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match) return `https://drive.google.com/file/d/${match[1]}/preview`;
            return cleanUrl;
        }

        function initMap() {
            map = L.map('map').setView(ADANA_CENTER, ADANA_ZOOM);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors | Taşköprü Gazetesi', maxZoom: 19
            }).addTo(map);
            markersCluster = L.markerClusterGroup({ spiderfyOnMaxZoom: true, showCoverageOnHover: false, zoomToBoundsOnClick: true });
            map.addLayer(markersCluster);
            fetchData();
        }

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                allData = data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('map').style.display = 'block';
                document.getElementById('totalCount').textContent = data.length;
                setTimeout(() => { map.invalidateSize(); }, 100);
                renderMarkers(allData);
            } catch (error) {
                console.error("Veri çekme hatası:", error);
                document.getElementById('loading').innerHTML = "❌ Veriler yüklenirken hata oluştu. Lütfen sayfayı yenileyin.";
            }
        }

        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function escapeAttr(str) { if (!str) return ''; return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"'); }

        function renderMarkers(data) {
            markersCluster.clearLayers();
            let visibleCount = 0;

            data.forEach(item => {
                if (activeStatus === 'cozuldu' && item.durum !== 'çözüldü') return;
                if (activeStatus === 'yayinlandi' && item.durum !== 'yayınlandı') return;
                if (activeFilter !== 'all' && getKategoriKey(item.tur) !== activeFilter) return;

                visibleCount++;
                
                let lat = item.koordinat?.lat;
                let lng = item.koordinat?.lng;

                if ((!lat || !lng) && item.haritaLink) {
                    const extracted = extractCoordsFromMapLink(item.haritaLink);
                    if (extracted) { lat = extracted.lat; lng = extracted.lng; }
                }

                lat = lat || ADANA_CENTER[0];
                lng = lng || ADANA_CENTER[1];

                const iconEmoji = getEmoji(item.tur);
                const markerColor = item.durum === 'çözüldü' ? 'green' : 'red';
                
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); background: ${markerColor === 'green' ? '#06d6a0' : 'white'}; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 3px solid ${markerColor === 'green' ? '#06d6a0' : '#e31e24'};">${iconEmoji}</div>`,
                    iconSize: [40, 40], iconAnchor: [20, 40]
                });

                let mediaHtml = '', mediaButtonsHtml = '';
                if (item.gorsel) {
                    const mediaLinks = item.gorsel.split(',').map(u => u.trim()).filter(u => u.length > 10);
                    if (mediaLinks.length > 0) {
                        const firstLink = mediaLinks[0];
                        const isVid = isVideo(firstLink);
                        const thumbUrl = getDriveThumbUrl(firstLink);

                        if (isVid) mediaHtml += `<div style="text-align:center; background:#000; border-radius:4px; margin-bottom:8px;"><div style="font-size:2rem; color:#fff; padding:20px;">🎥 Video</div></div>`;
                        else if (thumbUrl) mediaHtml += `<img src="${thumbUrl}" onerror="this.src='${FALLBACK_IMAGE}'" class="popup-img" alt="İhbar">`;
                        else mediaHtml += `<img src="${FALLBACK_IMAGE}" class="popup-img" alt="İhbar">`;

                        if (mediaLinks.length > 1 || isVid) {
                            mediaButtonsHtml += `<div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;">`;
                            mediaLinks.forEach((link, idx) => {
                                const isThisVid = isVideo(link);
                                const label = isThisVid ? '🎥 Video' : `📷 Görsel ${idx + 1}`;
                                const openLink = getDrivePreviewUrl(link);
                                const btnClass = isThisVid ? 'media-btn video' : 'media-btn';
                                mediaButtonsHtml += `<a href="${openLink}" target="_blank" class="${btnClass}">${label}</a>`;
                            });
                            mediaButtonsHtml += `</div>`;
                        } else {
                            mediaButtonsHtml = `<a href="${getDrivePreviewUrl(firstLink)}" target="_blank" class="media-btn" style="margin-top:8px; width:100%;">📷 Görseli/Videoyu Büyük Gör</a>`;
                        }
                    }
                }

                let mapLinkHtml = item.haritaLink ? `<a href="${item.haritaLink}" target="_blank" class="media-btn map" style="margin-top:4px; width:100%;">🗺️ Konumu Haritada Aç</a>` : '';
                const tarihFormatli = item.tarih ? new Date(item.tarih).toLocaleString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Belirtilmemiş';
                const coordsWarning = (!item.koordinat?.lat && !item.koordinat?.lng && !item.haritaLink) ? '<p style="font-size:0.75rem; color:#d97706; margin-top:4px;">⚠️ Konum bilgisi eksik, Adana merkezde gösteriliyor.</p>' : '';

                let kurumBadge = '';
                if (item.kurum && item.kurum !== 'Belirtilmedi') {
                    kurumBadge = `<div class="kurum-badge">🏛️ ${escapeHtml(item.kurum)}</div>`;
                }
                
                let cozumBox = '';
                if (item.belediyeAciklama && item.belediyeAciklama !== 'Belediye tarafından ek açıklama girilmedi.') {
                    cozumBox = `<div class="cozum-box"><div class="cozum-label">✅ ÇÖZÜM AÇIKLAMASI:</div><div class="cozum-text">${escapeHtml(item.belediyeAciklama)}</div></div>`;
                }

                // BASİT VE GÜVENİLİR YÖNTEM: onclick + return false
                const popupContent = `
                    <div class="ihbar-popup">
                        <h3>${iconEmoji} ${item.tur || 'Genel İhbar'}</h3>
                        ${kurumBadge}
                        <div class="ihbar-no-container">
                            <span class="ihbar-no">📋 ${escapeHtml(item.ihbarNo)}</span>
                            <span class="copy-btn" role="button" onclick="copyIhbarNoMap(event, '${escapeAttr(item.ihbarNo)}'); return false;">📋 Kopyala</span>
                        </div>
                        <p><span class="label">📍 Adres:</span> ${escapeHtml(item.adres || 'Belirtilmemiş')}</p>
                        ${cozumBox}
                        <p><span class="label">📝 İhbar Detayı:</span> ${escapeHtml(item.aciklama || 'Açıklama yok')}</p>
                        ${mediaHtml}
                        ${mediaButtonsHtml}
                        ${mapLinkHtml}
                        ${coordsWarning}
                        <div class="tarih">🕒 ${tarihFormatli}</div>
                    </div>
                `;

                const marker = L.marker([lat, lng], { icon: customIcon }).bindPopup(popupContent, { maxWidth: 300 });
                markersCluster.addLayer(marker);
            });

            document.getElementById('visibleCount').textContent = visibleCount;
        }

        // BASİT VE GÜVENİLİR KOPYALAMA FONKSİYONU
        function copyIhbarNoMap(event, text) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    var btn = event.target.closest('.copy-btn');
                    if (btn) {
                        var originalText = btn.textContent;
                        btn.textContent = '✅ Kopyalandı!';
                        btn.classList.add('copied');
                        setTimeout(function() {
                            btn.textContent = originalText;
                            btn.classList.remove('copied');
                        }, 1500);
                    }
                });
            }
            return false; // Zıplamayı kesin olarak engeller
        }

        function getKategoriKey(tur) {
            if (!tur) return 'diger';
            const map = { 'Çöp-Moloz-Temizlik': 'cop', 'Yol ve Kaldırım': 'yol', 'Yeşil Alan-Park-Bahçe Problemleri': 'yesil', 'Yeşil Alan': 'yesil', 'Park': 'yesil', 'Bahçe': 'yesil', 'Su ve Kanalizasyon': 'su', 'Toplu Taşıma': 'toplu', 'Trafik ve Otopark': 'trafik', 'Yaya Güvenliği': 'yaya', 'Gürültü ve Görüntü Kirliliği': 'gurultu', 'Gürültü': 'gurultu' };
            for (const k in map) { if (tur.includes(k)) return map[k]; }
            return 'diger';
        }

        function initFilters() {
            const box = document.getElementById('filterBox');
            const kategoriler = [
                {id: 'all', metin: 'Tümü', emoji: '📍'}, {id: 'cop', metin: 'Çöp-Moloz-Temizlik', emoji: '🗑️'},
                {id: 'yol', metin: 'Yol ve Kaldırım', emoji: '🕳️'}, {id: 'yesil', metin: 'Yeşil Alan-Park-Bahçe', emoji: '🌳'},
                {id: 'su', metin: 'Su ve Kanalizasyon', emoji: '💧'}, {id: 'toplu', metin: 'Toplu Taşıma', emoji: '🚌'},
                {id: 'trafik', metin: 'Trafik ve Otopark', emoji: '🚗'}, {id: 'yaya', metin: 'Yaya Güvenliği', emoji: '🚸'},
                {id: 'gurultu', metin: 'Gürültü ve Görüntü', emoji: '🔊'}, {id: 'diger', metin: 'Diğer', emoji: '📍'}
            ];

            kategoriler.forEach((k, i) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn kategori-btn' + (i === 0 ? ' active' : '');
                btn.textContent = k.emoji + ' ' + k.metin;
                btn.onclick = function() {
                    document.querySelectorAll('.kategori-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.cozuldu-btn').forEach(b => b.classList.remove('active'));
                    activeStatus = 'yayinlandi';
                    activeFilter = k.id;
                    renderMarkers(allData);
                };
                box.appendChild(btn);
            });

            const cozulduBtn = document.createElement('button');
            cozulduBtn.className = 'filter-btn cozuldu-btn';
            cozulduBtn.textContent = '✅ Çözülen Sorunlar';
            cozulduBtn.onclick = function() {
                document.querySelectorAll('.kategori-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeStatus = 'cozuldu';
                activeFilter = 'all';
                renderMarkers(allData);
            };
            box.appendChild(cozulduBtn);
        }

        window.onload = function() { initFilters(); initMap(); };
    </script>
    
 
</body>
</html>
